<title>ม้วนฝัน Reelume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: fixed stage rail on the left, working surface right; screenplay sits on a paper sheet under projector-dark chrome */
:root{
  --ink:#15100e; --ink-2:#1e1713; --ink-3:#2a211b; --line:#3a2e25;
  --gold:#d9a441; --gold-dim:#8f6d2c; --curtain:#a3372f; --paper:#efe6d2; --paper-ink:#241c14; --muted:#a39682; --fg:#f1e8d6;
  --f-display:'Bebas Neue','Noto Serif Thai',serif; --f-head:'Noto Serif Thai',Georgia,serif; --f-body:'Sarabun',system-ui,sans-serif; --f-script:'Courier Prime','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:15px/1.55 var(--f-body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[contenteditable]:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%}
.rail{background:var(--ink-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0;min-height:0}
.brand{padding:0 18px 18px;border-bottom:1px solid var(--line)}
.brand b{font:400 30px/1 var(--f-display);letter-spacing:.08em;color:var(--gold);display:block}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.proj{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.proj strong{display:block;color:var(--fg);font:600 14px var(--f-head)}
.steps{list-style:none;margin:10px 0;padding:0;flex:1;overflow:auto}
.step{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-left:3px solid transparent;padding:11px 18px;text-align:left}
.step .n{font:400 20px var(--f-display);width:22px;color:var(--muted)}
.step small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.step.on{background:var(--ink-3);border-left-color:var(--gold)}
.step.on .n{color:var(--gold)}
.step.locked{opacity:.55}
.step:hover:not(.on){background:#241b16}
.rail-foot{padding:12px 18px 0;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top h1{font:700 18px var(--f-head);margin:0;flex:1;min-width:140px}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.btn{background:var(--ink-3);border:1px solid var(--line);padding:7px 13px;border-radius:4px;font-size:13px}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:#1b1307;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#e6b552}
.btn.sm{padding:4px 9px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1b1307;font-weight:600}
.view{flex:1;overflow:auto;padding:24px;min-height:0}
.menu{position:relative}
.pop{position:absolute;right:0;top:110%;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;min-width:210px;z-index:20;padding:6px;box-shadow:0 12px 30px #0008}
.pop button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:8px 10px;text-align:left;border-radius:4px;font-size:13px}
.pop button:hover{background:var(--ink-3)}
.pop button[disabled]{opacity:.45;cursor:not-allowed}
/* home */
.home h2{font:700 24px var(--f-head);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.poster{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.poster:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.poster{transition:transform .15s,border-color .15s}
.art{aspect-ratio:2/3;max-height:260px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(180deg,#3b1f1b 0%,#1d1210 70%);position:relative;border-bottom:3px double var(--gold-dim)}
.art.b{background:linear-gradient(180deg,#1f2b33,#10161a)}
.art.c{background:linear-gradient(180deg,#352a14,#17120a)}
.art i{font:normal 400 13px var(--f-display);letter-spacing:.2em;color:var(--gold);position:absolute;top:12px;left:14px}
.art b{font:400 30px/1 var(--f-display);letter-spacing:.04em;color:var(--paper)}
.art em{font-style:normal;font-size:12px;color:var(--muted)}
.pmeta{padding:10px 14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.badge{font-size:11px;border:1px solid var(--gold-dim);color:var(--gold);padding:1px 7px;border-radius:99px;white-space:nowrap}
.new{display:flex;align-items:center;justify-content:center;min-height:180px;border:1px dashed var(--gold-dim);background:none;color:var(--gold);border-radius:4px;font:600 15px var(--f-head);flex-direction:column;gap:6px}
.new span{font:400 38px/1 var(--f-display)}
/* script view */
.wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 10px;font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
textarea,select,input[type=text]{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:9px 10px;font:inherit}
textarea{resize:vertical;min-height:84px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:#2a2113}
.acts{display:grid;gap:10px}
.act{border-left:3px solid var(--curtain);padding:2px 0 2px 12px}
.act b{font:700 13px var(--f-head);display:block}
.act p{margin:2px 0 0;font-size:13px;color:#d8ccb6}
.act.empty{color:var(--muted);font-size:13px;border-left-color:var(--line)}
.sheet-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sheet-bar .grow{flex:1}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:40px clamp(18px,6%,64px);font:400 14px/1.7 var(--f-script);box-shadow:0 0 0 1px #0006,0 18px 40px #0007;min-height:420px}
.blk{padding:3px 6px;margin:0 -6px;border-radius:2px;outline:0;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.blk:hover{background:#0000000d}
.blk.sel{background:#d9a44140}
.blk[data-t=scene]{font-weight:700;text-transform:uppercase;margin-top:18px}
.blk[data-t=char]{text-transform:uppercase;margin:12px auto 0;width:min(240px,70%);text-align:left}
.blk[data-t=dlg]{width:min(360px,90%);margin:0 auto 0}
.blk[data-t=paren]{width:min(280px,80%);margin:0 auto;font-style:italic}
.blk[data-t=act]{margin-top:10px}
.tag{position:absolute;left:-58px;top:4px;font:700 9px var(--f-body);color:#8a7a60;letter-spacing:.08em;width:50px;text-align:right;display:none}
.sheet:hover .tag{display:block}
@media(max-width:700px){.tag{display:none!important}}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1b1307;padding:9px 16px;border-radius:4px;font-weight:600;font-size:13px;z-index:50;max-width:90vw}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .brand{padding:10px 14px;border:0;flex:none}.brand span,.proj,.rail-foot{display:none}
  .steps{display:flex;margin:0;overflow:visible;flex:none}
  .step{border-left:0;border-bottom:3px solid transparent;padding:10px 12px;white-space:nowrap}
  .step.on{border-bottom-color:var(--gold)}.step small{display:none}
  .top{padding:10px 14px}.view{padding:16px 14px}
}
/* storyboard */
.sb-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.sb-top h2{font:700 22px var(--f-head);margin:0;flex:1;min-width:160px}
.sb-empty{border:1px dashed var(--gold-dim);border-radius:6px;padding:44px 20px;text-align:center;color:var(--muted)}
.scn{font:400 20px var(--f-display);letter-spacing:.12em;color:var(--gold);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.shot{background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.shot.drag{opacity:.4}.shot.over{border-color:var(--gold)}
.shot-h{display:flex;align-items:center;gap:8px}
.shot-h b{font:400 22px var(--f-display);color:var(--gold);letter-spacing:.06em}
.grab{cursor:grab;color:var(--muted);font-size:16px;user-select:none;padding:0 4px}
.shot-h .sp{flex:1}
.mv{background:none;border:1px solid var(--line);border-radius:3px;width:26px;height:24px;line-height:1;font-size:12px}
.mv:hover:not([disabled]){border-color:var(--gold-dim)}.mv[disabled]{opacity:.35;cursor:default}
.sketch{border:2px solid var(--paper);border-radius:2px;aspect-ratio:var(--ar,16/9);width:100%;max-width:calc(420px*var(--arn,1.78));margin-inline:auto;overflow:hidden;background:#111;position:relative}
.mock{position:absolute;left:6px;bottom:6px;background:#000c;color:var(--gold);font-size:10px;padding:2px 7px;border-radius:3px;max-width:calc(100% - 12px)}
.genload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--gold);font-size:12px;text-align:center;padding:12px}
.genload i{display:block;width:60%;height:3px;background:var(--line);overflow:hidden;border-radius:2px;position:relative}
.genload i::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.genload small{color:var(--muted);font-family:var(--f-script);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.gem{border-color:var(--gold-dim);color:var(--gold)}
.sketch svg,.sketch img{display:block;width:100%;height:100%}
.sketch img{object-fit:cover}
.shot-act{display:flex;gap:8px;flex-wrap:wrap}
.sel3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sel3 label{margin:0 0 2px;font-size:11px}
.sel3 select{padding:5px 6px;font-size:12px}
.shot p{margin:0;font-size:13px;color:#d8ccb6}
.shot textarea{min-height:58px;font-size:12px;font-family:var(--f-script)}
/* characters */
.cw{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.cw{grid-template-columns:minmax(0,1fr)}.clist{display:flex;flex-wrap:wrap}}
.clist{display:grid;gap:8px}
.cbtn{display:flex;gap:10px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;text-align:left;width:100%}
.cbtn.on{border-color:var(--gold);background:var(--ink-3)}
.av{width:38px;height:38px;border-radius:50%;background:#3b1f1b;border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font:700 15px var(--f-head);color:var(--gold);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cbtn small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.row2,.row3{grid-template-columns:minmax(0,1fr)}}
.sheet4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:700px){.sheet4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);text-align:center}
.slot .im{aspect-ratio:3/4;border:2px solid var(--paper);border-radius:2px;overflow:hidden;background:#1b1411;position:relative;display:flex;align-items:center;justify-content:center}
.slot .im svg{width:70%;height:70%}
.slot .im img{width:100%;height:100%;object-fit:cover;display:block}
.refs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ref{width:64px;height:64px;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--line)}
.ref img{width:100%;height:100%;object-fit:cover;display:block}
.ref button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:#000b;color:var(--fg);font-size:11px;line-height:1;padding:0}
.lock{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--ink)}
.lock.on{border-color:var(--gold);color:var(--gold)}
.lock input{accent-color:var(--gold);width:18px;height:18px}
input[type=range]{width:100%;accent-color:var(--gold)}
/* video */
.vwrap{position:absolute;inset:0;overflow:hidden}
.vwrap img,.vwrap svg{width:100%;height:100%;display:block}
.vwrap img{object-fit:cover}
@keyframes kz{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes kl{from{transform:scale(1.15) translateX(3%)}to{transform:scale(1.15) translateX(-3%)}}
@keyframes kr{from{transform:scale(1.15) translateX(-3%)}to{transform:scale(1.15) translateX(3%)}}
@keyframes ko{from{transform:scale(1.18)}to{transform:scale(1)}}
.vwrap img.k0{animation:kz 6s ease-in-out infinite alternate}
.vwrap img.k1{animation:kl 6s ease-in-out infinite alternate}
.vwrap img.k2{animation:kr 6s ease-in-out infinite alternate}
.vwrap img.k3{animation:ko 6s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.vwrap img{animation:none!important}}
.vig::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px #000a;pointer-events:none}
.pov{position:absolute;right:7%;bottom:9%;width:17%;aspect-ratio:1;object-fit:contain;background:#efe6d2d9;border-radius:4px;padding:3px;border:1px solid var(--gold)}
.vstate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:12px;color:var(--gold);background:#0009}
.pbar{width:60%;height:4px;background:#000a;border-radius:2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold)}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.r{border-color:var(--gold);color:var(--gold)}.pill.d{border-color:#5d8f5d;color:#8fc48f}
.dlg{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12.5px}
.dlg b{color:var(--gold);font-size:11px;display:block;font-weight:600}
.sug{background:#2a2113;border:1px solid var(--gold-dim);border-radius:4px;padding:8px 10px;font-size:12px;display:grid;gap:6px}
.takes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pname{font-size:10px;color:var(--muted);text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* edit */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media(max-width:1100px){.ed{grid-template-columns:minmax(0,1fr)}}
.pv{max-width:760px}
.pv .sketch{max-width:calc(520px*var(--arn,1.78));margin-inline:0}
.subt{position:absolute;left:6%;right:6%;bottom:7%;text-align:center;color:#fff;font:600 clamp(12px,2.1vw,19px)/1.35 var(--f-body);text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none}
.pvl{position:absolute;left:8px;top:8px;background:#000b;color:var(--gold);font-size:11px;padding:2px 8px;border-radius:3px}
.cred{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--paper);font:400 13px/1.9 var(--f-head);overflow:hidden}
.cred div{will-change:transform}
.cred small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ctl{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.ctl .t{font:400 22px var(--f-display);color:var(--gold);letter-spacing:.08em;min-width:110px}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--ink-2);margin-top:6px}
.tlin{position:relative;min-width:100%}
.trow{display:flex;align-items:stretch;border-bottom:1px solid var(--line);height:40px}
.trow:last-child{border-bottom:0}
.tlab{position:sticky;left:0;z-index:3;width:88px;flex:none;background:var(--ink-3);border-right:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:4px}
.tlab button{background:none;border:1px solid var(--line);border-radius:3px;font-size:10px;padding:0 5px;color:var(--muted)}
.tlab button.on{background:var(--curtain);color:var(--paper);border-color:var(--curtain)}
.lane{position:relative;flex:none;cursor:pointer}
.lane.mute{opacity:.35}
.ruler{height:24px}
.ruler .lane{background:repeating-linear-gradient(90deg,transparent 0,transparent 139px,#3a2e25 139px,#3a2e25 140px)}
.tk{position:absolute;top:4px;font-size:10px;color:var(--muted);transform:translateX(3px)}
.clip{position:absolute;top:5px;bottom:5px;border-radius:3px;font-size:10.5px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#1b1307;display:flex;align-items:center}
.clip.v{background:#b9863a}.clip.c{background:#6b6154;color:var(--paper)}.clip.d{background:#c9774c}.clip.m{background:#5a8a8a}.clip.x{background:#8a6a9a;color:#fff}.clip.s{background:#d8ccb6}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--curtain);z-index:4;pointer-events:none}
.ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--curtain)}
.sidep .panel{margin-bottom:14px}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;margin-top:6px}
.mini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px;margin-top:6px;color:var(--muted)}
.sl output{text-align:right;color:var(--fg)}
.clip{cursor:grab;touch-action:none;user-select:none}
.clip.sel{outline:2px solid var(--paper);outline-offset:-1px;z-index:2}
.clip i{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.clip i.hl{left:0}.clip i.hr{right:0}
.clip.sel i{background:#0004}
#etb{margin:2px 0 10px}
.chip input{display:none}
/* membership */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.plan{display:flex;flex-direction:column;gap:8px;margin:0}
.plan.feat{border-color:var(--gold)}
.plan .pr{font:400 40px/1 var(--f-display);color:var(--gold);letter-spacing:.03em}
.plan .pr small{font:400 13px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:4px}
.plan ul{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:7px;font-size:13px;flex:1}
.plan li::before{content:"✓ ";color:var(--gold)}
.plan .btn[disabled]{opacity:.5;cursor:default}
.co2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}

function renderPlans(){
 var m=TM[L],y=CO.cycle==='y',h='<div class="home"><h2>'+m.plansT+'</h2><p class="sub">'+m.plansSub+'</p>'+
  '<div class="seg" style="margin-bottom:18px"><button id="cM" class="'+(y?'':'on')+'">'+m.monthly+'</button><button id="cY" class="'+(y?'on':'')+'">'+m.yearly+' · '+m.save+'</button></div><div class="pgrid">';
 PL.forEach(function(p,i){
  var pr=y?p.py:p.pm,cur=AC.plan===i&&(i===0||AC.cycle===CO.cycle);
  h+='<div class="panel plan'+(i===1?' feat':'')+'"><div style="display:flex;gap:8px;align-items:center"><h3 style="margin:0">'+p.n+'</h3>'+(i===1?'<span class="badge">'+m.pop+'</span>':'')+'</div>'+
   '<div class="pr">'+(i===0?m.free:baht(pr))+(i>0?'<small>'+(y?m.perYr:m.perMo)+'</small>':'')+'</div>'+
   '<div class="hint" style="margin:0">'+(i>0&&y?m.eq(Math.round(p.py/12)):'&nbsp;')+'</div>'+
   '<ul><li>'+p.cr.toLocaleString('en-US')+' '+m.credMo+'</li><li>'+m.expQ+' '+p.q+'</li><li>'+(p.wm?m.wmY:m.wmN)+'</li></ul>'+
   '<button class="btn'+(i===1?' gold':'')+'" data-pl="'+i+'"'+(cur?' disabled':'')+'>'+(cur?m.cur:(i===0?m.toFree:m.choose))+'</button></div>';
 });
 h+='</div><div class="panel" style="margin-top:18px"><h3>'+m.costT+'</h3>'+[[m.cImg,COST.img],[m.cSheet,COST.sheet],[m.cVid,COST.vid]].map(function(r){return'<div class="mini"><span>'+r[0]+'</span><b>'+r[1]+' '+m.credUnit+'</b></div>'}).join('')+'<p class="hint">'+m.note+'<br>'+m.sample+'</p></div></div>';
 $('view').innerHTML=h;
 $('cM').onclick=function(){CO.cycle='m';renderPlans()};$('cY').onclick=function(){CO.cycle='y';renderPlans()};
 $('view').querySelectorAll('[data-pl]').forEach(function(b){b.onclick=function(){var i=+b.dataset.pl;if(i===0){S.view='account'}else{CO.plan=i;CO.agree=false;CO.busy=false;CO.qr=false;S.view='checkout'}render()}});
}
function renderCheckout(){
 var m=TM[L],p=PL[CO.plan],y=CO.cycle==='y',amt=price(CO.plan,CO.cycle),nx=addC(new Date(),CO.cycle);
 var h='<div class="home"><button class="btn sm" id="coBack">'+m.back+'</button><h2 style="margin:12px 0 16px">'+m.co+'</h2><div class="co2"><div>';
 h+='<div class="panel"><h3>'+m.email+'</h3><input type="text" id="coEmail" value="'+esc(CO.email||'')+'" placeholder="you@example.com"></div>';
 h+='<div class="panel"><h3>'+m.method+'</h3>'+
  '<button class="opt'+(CO.method==='card'?' on':'')+'" data-mt="card"><span>'+(CO.method==='card'?'◉':'○')+'</span><span><b>'+m.card+'</b><small>'+m.cardH+'</small></span></button>'+
  '<button class="opt'+(CO.method==='qr'?' on':'')+'" data-mt="qr"><span>'+(CO.method==='qr'?'◉':'○')+'</span><span><b>'+m.qr+'</b><small>'+m.qrH+'</small></span></button>'+
  '<p class="hint">'+(CO.method==='card'?m.autoCard(y):m.autoQr)+'</p></div>';
 h+='<label class="lock'+(CO.agree?' on':'')+'" style="margin:0 0 14px"><input type="checkbox" id="coAgree"'+(CO.agree?' checked':'')+'><span>'+m.agree+'</span></label>';
 if(CO.qr)h+='<div class="panel" style="text-align:center"><div class="qrbox">'+m.qrBox+'</div><p class="hint">'+m.qrSub+'</p><div class="pbar" style="margin:10px auto"><i style="width:60%"></i></div><div class="hint">'+m.waitQr+'</div></div>';
 else h+='<button class="btn gold" id="payBtn" style="width:100%;padding:12px">'+m.pay+' · '+baht(amt)+'</button>';
 h+='<p class="hint">'+m.mockNote+'</p></div>';
 h+='<div class="panel"><h3>'+m.summ+'</h3><div class="mini"><span>'+p.n+' · '+(y?m.yearly:m.monthly)+'</span><b>'+baht(amt)+'</b></div><div class="mini"><span>'+p.cr.toLocaleString('en-US')+' '+m.credMo+'</span><span></span></div><div class="mini"><span>'+m.expQ+' '+p.q+'</span><span></span></div><div class="mini"><span>'+(p.wm?m.wmY:m.wmN)+'</span><span></span></div>'+
  '<div class="mini" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><span>'+m.total+'</span><b style="color:var(--gold);font-size:16px">'+baht(amt)+'</b></div><div class="mini"><span>'+m.nextBill+'</span><span>'+fmtD(nx)+'</span></div></div></div></div>';
 $('view').innerHTML=h;
 $('coBack').onclick=function(){S.view='plans';render()};
 $('coEmail').oninput=function(e){CO.email=e.target.value};
 $('view').querySelectorAll('[data-mt]').forEach(function(b){b.onclick=function(){if(CO.busy)return;CO.method=b.dataset.mt;renderCheckout()}});
 $('coAgree').onchange=function(e){CO.agree=e.target.checked;renderCheckout()};
 var pb=$('payBtn');if(pb)pb.onclick=function(){
  if(CO.busy)return;
  if(!CO.agree)return toast(m.needAgree);
  CO.busy=true;
  function fin(){if(S.view!=='checkout'){CO.busy=false;CO.qr=false;return}CO.busy=false;CO.qr=false;activate();S.view='success';render();toast(TM[L].ok)}
  if(CO.method==='qr'){CO.qr=true;renderCheckout();setTimeout(fin,2600)}
  else{pb.textContent=m.paying;pb.disabled=true;setTimeout(fin,1400)}
 };
}
function renderSuccess(){
 var m=TM[L],hs=AC.hist[0];
 if(!hs){S.view='plans';return renderPlans()}
 var rows=[[m.rDate,fmtD(hs.d)],[m.rItem,PL[hs.pi].n+' · '+(hs.c==='y'?m.yearly:m.monthly)],[m.rAmt,baht(hs.amt)],[m.rMethod,mlabel(hs.method)],[AC.method==='card'?m.rNext:m.rEnd,fmtD(AC.renew)],[m.rCred,AC.credits.toLocaleString('en-US')+' '+m.credUnit]];
 var h='<div class="home" style="max-width:560px"><div class="panel" style="text-align:center"><div style="font:400 46px/1 var(--f-display);color:var(--gold)">✓</div><h2 style="margin:8px 0 4px">'+m.ok+'</h2><p class="sub" style="margin-bottom:0">'+m.okSub+'</p></div>'+
  '<div class="panel"><h3>'+m.recT+'</h3>'+rows.map(function(r){return'<div class="mini"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>'}).join('')+'</div>'+
  '<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" id="sStart">'+m.start+'</button><button class="btn" id="sAcct">'+m.acct+'</button></p></div>';
 $('view').innerHTML=h;
 $('sStart').onclick=function(){S.view='script';render()};$('sAcct').onclick=function(){S.view='account';render()};
}
function renderAccount(){
 var m=TM[L],p=PL[AC.plan],pct=Math.max(0,Math.min(100,AC.credits/p.cr*100)),paid=AC.plan>0;
 var h='<div class="home" style="max-width:760px"><h2>'+m.acct+'</h2><div class="panel"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">'+p.n+'</h3><span class="pill'+(AC.cancel?'':' d')+'">'+(AC.cancel?m.st.cancel:m.st.act)+'</span>'+(paid?'<span class="hint" style="margin:0">'+(AC.cycle==='y'?m.yearly:m.monthly)+'</span>':'')+'</div>'+
  '<label>'+m.used+' · '+AC.credits.toLocaleString('en-US')+' / '+p.cr.toLocaleString('en-US')+'</label><div class="pbar" style="width:100%;height:8px"><i style="width:'+pct+'%"></i></div>'+
  '<div class="mini" style="margin-top:12px"><span>'+m.expQ+' '+p.q+'</span><span>'+(p.wm?m.wmY:m.wmN)+'</span></div>';
 if(paid)h+='<div class="mini"><span>'+(AC.cancel?m.endOn:m.renewOn)+'</span><b>'+fmtD(AC.renew)+'</b></div><div class="mini"><span>'+m.method2+'</span><span>'+mlabel(AC.method)+' · '+(AC.auto&&!AC.cancel?m.autoOn:m.autoOff)+'</span></div>';
 h+='<p style="margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn gold" id="aPlans">'+(paid?m.change:m.upgrade)+'</button>';
 if(paid&&!AC.cancel)h+='<button class="btn" id="aSw">'+(AC.cycle==='y'?m.switchM:m.switchY)+'</button>';
 if(paid&&AC.method==='card'){
  if(AC.cc)h+='<span class="hint" style="margin:0">'+m.cancelAsk+'</span><button class="btn" id="aYes">'+m.yes+'</button><button class="btn" id="aNo">'+m.no+'</button>';
  else if(AC.cancel)h+='<button class="btn" id="aRes">'+m.resume+'</button>';
  else h+='<button class="btn" id="aCan">'+m.cancelBtn+'</button>';
 }
 h+='</p>';
 if(paid&&AC.method==='qr')h+='<p class="hint">'+m.qrNoAuto+'</p>';
 h+='</div><div class="panel"><h3>'+m.hist+'</h3>';
 if(!AC.hist.length)h+='<div class="hint" style="margin:0">'+m.none+'</div>';
 else h+='<div class="tblw"><table class="tbl"><thead><tr>'+m.hd.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+AC.hist.map(function(r){return'<tr><td>'+fmtD(r.d)+'</td><td>'+PL[r.pi].n+' · '+(r.c==='y'?m.yearly:m.monthly)+'</td><td>'+baht(r.amt)+'</td><td>'+mlabel(r.method)+'</td><td>'+m.paid+'</td></tr>'}).join('')+'</tbody></table></div>';
 h+='</div></div>';
 $('view').innerHTML=h;
 $('aPlans').onclick=function(){S.view='plans';render()};
 var sw=$('aSw');if(sw)sw.onclick=function(){CO.plan=AC.plan;CO.cycle=AC.cycle==='y'?'m':'y';CO.agree=false;CO.busy=false;CO.qr=false;S.view='checkout';render()};
 var c1=$('aCan');if(c1)c1.onclick=function(){AC.cc=true;renderAccount()};
 var y1=$('aYes');if(y1)y1.onclick=function(){AC.cc=false;AC.cancel=true;AC.auto=false;renderAccount();toast(m.canceled)};
 var n1=$('aNo');if(n1)n1.onclick=function(){AC.cc=false;renderAccount()};
 var r1b=$('aRes');if(r1b)r1b.onclick=function(){AC.cancel=false;AC.auto=true;renderAccount();toast(m.resumed)};
}
$('acctBtn').onclick=function(){S.view='account';render()};
$('planBtn').onclick=function(){S.view='plans';render()};
function render(){renderSteps();renderChrome();var v=S.view,m=TM[L];
 if(v==='home')renderHome();else if(v==='board')renderBoard();else if(v==='chars')renderChars();else if(v==='video')renderVideo();else if(v==='edit')renderEdit();
 else if(v==='plans'){renderPlans();$('title').textContent=m.plansT}
 else if(v==='checkout'){renderCheckout();$('title').textContent=m.co}
 else if(v==='success'){renderSuccess();$('title').textContent=m.ok}
 else if(v==='account'){renderAccount();$('title').textContent=m.acct}
 else renderScript()}
$('arSel').onchange=function(e){arI=+e.target.value;applyAR();if(S.view==='board')renderBoard();touchSave();toast((L==='th'?'เปลี่ยนอัตราส่วนเป็น ':'Aspect ratio: ')+ARN[L][arI].split(' ')[0])};
applyAR();
$('homeBtn').onclick=function(){S.view='home';render()};
$('lTh').onclick=function(){L='th';$('lTh').classList.add('on');$('lEn').classList.remove('on');render()};
$('lEn').onclick=function(){L='en';$('lEn').classList.add('on');$('lTh').classList.remove('on');render()};
$('shareBtn').onclick=function(){var u=location.href;try{navigator.clipboard.writeText(u).catch(function(){})}catch(e){}toast(t().copied)};
$('verBtn').onclick=function(){toast(t().verMsg)};
$('expBtn').onclick=function(e){e.stopPropagation();$('expPop').hidden=!$('expPop').hidden};
document.addEventListener('click',function(e){if(!e.target.closest('.menu'))$('expPop').hidden=true});
render();
})();
</script>
